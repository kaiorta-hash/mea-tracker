<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MEA-CartPole Design Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="app-style">
/* Layout: instrument-panel header, loop strip, then a two-pane tree + inspector. */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --surface-2:#E8EEF0; --ink:#13212B; --ink-2:#465763; --ink-3:#7A8893;
  --line:#D2DBE0; --accent:#0B6E78; --accent-soft:#D3EBED;
  --st-todo:#7A8893; --st-research:#2F6FB5; --st-proposed:#A3620A; --st-decided:#0B6E78;
  --st-build:#6A4DB0; --st-verified:#2E7D46; --st-blocked:#B23A3A;
  --s1:#0B6E78; --s2:#3A63C9; --s3:#C2410C; --s4:#7C3AED; --s5:#1F8A4C; --s6:#B8326B;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1418; --surface:#141E25; --surface-2:#1B272F; --ink:#E3EBEF; --ink-2:#A6B5BE; --ink-3:#74848E;
  --line:#2A3842; --accent:#4FC1C9; --accent-soft:#163539;
  --st-todo:#8C9BA5; --st-research:#80B1EA; --st-proposed:#E8B24F; --st-decided:#4FC1C9;
  --st-build:#B39EF1; --st-verified:#6FCF8E; --st-blocked:#F08484;
  --s1:#4FC1C9; --s2:#86A7F2; --s3:#F2925F; --s4:#B697F6; --s5:#5FCB8A; --s6:#EE7FAD; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1418; --surface:#141E25; --surface-2:#1B272F; --ink:#E3EBEF; --ink-2:#A6B5BE; --ink-3:#74848E;
  --line:#2A3842; --accent:#4FC1C9; --accent-soft:#163539;
  --st-todo:#8C9BA5; --st-research:#80B1EA; --st-proposed:#E8B24F; --st-decided:#4FC1C9;
  --st-build:#B39EF1; --st-verified:#6FCF8E; --st-blocked:#F08484;
  --s1:#4FC1C9; --s2:#86A7F2; --s3:#F2925F; --s4:#B697F6; --s5:#5FCB8A; --s6:#EE7FAD; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}

/* header */
header.top{border-bottom:1px solid var(--line);background:var(--surface)}
header.top .wrap{display:grid;grid-template-columns:1fr auto;gap:24px;padding-block:22px 18px;align-items:start}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
h1{font-family:var(--display);font-weight:600;font-size:clamp(28px,4vw,40px);line-height:1.02;margin:6px 0 6px;letter-spacing:.005em;text-wrap:balance}
.lede{color:var(--ink-2);max-width:62ch;margin:0}
.gates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
.gate{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--bg);min-width:0;text-align:left;display:block;width:100%}
.gate:hover{border-color:var(--accent)}
.gate[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.gate .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.gate .num{font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.gate .sub{font-size:12px;color:var(--ink-2)}
.bar{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent)}
.gate.review .num{color:var(--st-proposed)}
.gate.review .bar>i{background:var(--st-proposed)}
.mea{display:flex;flex-direction:column;align-items:center;gap:6px}
.mea svg{display:block}
.mea .cap{font-family:var(--mono);font-size:10px;color:var(--ink-3);text-align:center;line-height:1.35;width:180px}

/* loop strip */
section.loop{padding-block:18px 4px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.sec-h h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0;letter-spacing:.01em}
.sec-h p{margin:0;color:var(--ink-3);font-size:12px}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;align-items:stretch}
.stage{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);padding:10px 12px 10px;min-width:0;display:flex;flex-direction:column;gap:4px;border-radius:0;margin-left:-1px}
.stage:first-child{border-radius:6px 0 0 6px;margin-left:0}
.stage:last-child{border-radius:0 6px 6px 0}
.stage:hover{background:var(--surface-2)}
.stage .n{font-family:var(--mono);font-size:11px;color:var(--accent)}
.stage .t{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.1}
.stage .s{font-size:11.5px;color:var(--ink-2);line-height:1.3;flex:1}
.stage .m{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--ink-3);gap:6px}
.stage .m b{font-weight:500;color:var(--st-proposed)}
.stage:not(:last-child)::after{content:"";position:absolute;right:-6px;top:50%;width:10px;height:10px;border-top:1px solid var(--line);border-right:1px solid var(--line);background:var(--surface);transform:translateY(-50%) rotate(45deg);z-index:1}
.stage:hover::after{background:var(--surface-2)}
.return{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:right;margin-top:6px}
.others{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:12px}
.other{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 12px;min-width:0;display:flex;flex-direction:column;gap:3px}
.other:hover{background:var(--surface-2)}
.other .t{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.1}

/* main */
main .wrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;padding-block:18px 28px;align-items:start}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.toolbar input[type=search]{flex:1 1 200px;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.toolbar select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);max-width:100%}
.btn{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.btn.danger{color:var(--st-blocked)}
.btn.danger.armed{background:var(--st-blocked);border-color:var(--st-blocked);color:var(--bg)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--ink-3);margin:0 0 10px}
.legend span{display:inline-flex;align-items:center;gap:5px}

.treebox{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 6px 10px;overflow-x:auto}
ul.tree,ul.tree ul{list-style:none;margin:0;padding:0}
ul.tree ul{margin-left:13px;padding-left:10px;border-left:1px solid var(--line)}
.row{display:grid;grid-template-columns:20px 14px minmax(0,1fr) auto;align-items:center;gap:6px;padding:5px 8px 5px 2px;border-radius:5px;cursor:pointer;min-height:32px}
.row:hover{background:var(--surface-2)}
.row.sel{background:var(--accent-soft)}
.row.dim .ttl{color:var(--ink-3)}
.row.area .ttl{font-weight:600}
.row.top .ttl{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.01em}
.chev{width:20px;height:20px;border:0;background:none;padding:0;color:var(--ink-3);display:grid;place-items:center;border-radius:4px}
.chev:hover{background:var(--line)}
.chev svg{transition:transform .15s}
.chev[aria-expanded=false] svg{transform:rotate(-90deg)}
.ttl{min-width:0;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.chip.need{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.chip.need.full{background:var(--accent-soft)}
.chip.due{color:var(--ink-2)}
.chip.due.soon{color:var(--st-proposed);border-color:color-mix(in srgb,var(--st-proposed) 50%,var(--line))}
.chip.due.over{color:var(--st-blocked);border-color:var(--st-blocked);font-weight:500}
.chip.due.done{opacity:.55;text-decoration:line-through}
.sted .lk{display:grid;grid-template-columns:170px 1fr auto;gap:6px;margin-bottom:6px}
.sted .lk select,.sted .lk input,.sted input{min-width:0;width:100%;box-sizing:border-box}
.sted .lab{font-size:12px;color:var(--ink-3);margin:10px 0 6px}
.sted .row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
@media (max-width:640px){.sted .lk{grid-template-columns:1fr}}
.dueline{font-family:var(--mono);font-size:11px;color:var(--ink-2);margin-top:4px}
.dueline.over{color:var(--st-blocked)} .dueline.soon{color:var(--st-proposed)}
.syncpanel{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:12px 14px;margin-bottom:10px;font-size:13px}
.syncpanel p{margin:0 0 8px;line-height:1.5}
.syncpanel .grid2{margin-bottom:8px}
.syncpanel input{width:100%;box-sizing:border-box}
.syncpanel .row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.syncpanel .ok{color:var(--st-verified)}
.chip{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);border:1px solid var(--line);border-radius:3px;padding:1px 5px;white-space:nowrap}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.prog{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.prog .bar{width:54px;margin:0}

/* kind glyphs */
.g{width:11px;height:11px;display:inline-block;justify-self:center}
.g.area{width:12px;height:9px;border:1.5px solid var(--ink-3);border-radius:2px}
.g.decision{width:9px;height:9px;transform:rotate(45deg);border:1.5px solid var(--st-proposed);background:color-mix(in srgb,var(--st-proposed) 25%,transparent)}
.g.build{width:10px;height:10px;background:var(--ink-2);border-radius:2px}
.g.test{border:1.5px solid var(--st-verified);border-radius:50%}
.g.question{border:1.5px dashed var(--st-research);border-radius:50%}

/* inspector */
aside.insp{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;max-height:calc(100vh - 24px);overflow:auto}
.insp-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);gap:8px}
.insp-h .crumb{font-family:var(--mono);font-size:11px;color:var(--ink-3);overflow-wrap:anywhere}
.insp-b{padding:12px 14px 16px;display:flex;flex-direction:column;gap:12px}
.insp .x{display:none}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.field>.lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.field input,.field select,.field textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.field textarea{min-height:120px;resize:vertical;line-height:1.45}
.field textarea.auto{min-height:0;resize:none;overflow:hidden}
.field textarea.short{min-height:52px}
#e-notes{min-height:90px}
.field.sect{border-top:1px solid var(--line);padding-top:10px}
.lst{display:flex;flex-direction:column;gap:5px}
.li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:6px;align-items:start}
.li input[type=checkbox]{width:16px;height:16px;margin:8px 0 0;accent-color:var(--accent)}
.li textarea{padding:5px 8px;font-size:13px}
.lst.bugs .bul{width:7px;height:7px;border-radius:50%;background:var(--st-blocked);margin:11px 0 0 5px}
.lst.files .bul{width:7px;height:7px;border-radius:2px;background:var(--ink-3);margin:11px 0 0 5px}
.lst.files textarea{font-family:var(--mono);font-size:12px}
.btn.xs{padding:3px 8px;font-size:12px}
.btn.add{align-self:flex-start}
.field input.title-in{font-family:var(--display);font-size:20px;font-weight:600;padding:6px 9px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center}
.opt input[type=radio]{width:auto;accent-color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:6px}
.depchips{display:flex;flex-wrap:wrap;gap:6px}
.dep{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:4px;padding:2px 4px 2px 7px;font-size:12px;background:var(--bg);max-width:100%}
.dep button{border:0;background:none;padding:0 3px;color:var(--ink-3)}
.dep .go{color:var(--ink);text-align:left;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.empty{padding:28px 16px;color:var(--ink-3);text-align:center}
.ro-note{font-size:12px;color:var(--ink-3);background:var(--surface-2);border-radius:6px;padding:8px 10px}
.donechip{font-size:12px;color:var(--ink-2)}

/* save bar + banner */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 20px color-mix(in srgb,var(--ink) 10%,transparent)}
.savebar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.savebar .msg{flex:1;min-width:180px;font-size:13px}
.banner{background:color-mix(in srgb,var(--st-proposed) 14%,var(--surface));border-bottom:1px solid var(--line)}
.banner .wrap{display:flex;gap:10px;align-items:center;padding-block:10px;flex-wrap:wrap}
.banner p{margin:0;flex:1;min-width:200px;font-size:13px}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:30}

/* full-cycle diagram */
section.cycle{padding-block:8px 140px}
.cyc-lede{color:var(--ink-2);margin:0 0 12px;max-width:72ch}
.streams{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.stream{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 9px;font-size:13px;text-align:left}
.stream:hover{background:var(--surface-2)}
.stream .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.stream small{color:var(--ink-3);font-family:var(--mono);font-size:11px}
.stream[aria-pressed=true]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.cyclebox{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
.cyclebox svg{display:block;width:100%;min-width:840px;height:auto}
.cyc-key{display:flex;flex-wrap:wrap;gap:16px;font-size:11.5px;color:var(--ink-3);margin-top:8px}
.cyc-key span{display:inline-flex;align-items:center;gap:6px}
.cyc-key i{display:inline-block;width:22px;height:0;border-top:1.6px solid var(--ink-2)}
.cyc-key i.d{border-top:1.4px dashed var(--ink-3)}
.cyc-detail{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.cyc-detail h3{font-family:var(--display);font-weight:600;font-size:19px;margin:0 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cyc-detail h3 small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--ink-3)}
.cyc-detail ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 18px}
.cyc-detail li{font-size:13px;color:var(--ink-2);min-width:0}
.cyc-detail li button{border:0;background:none;padding:0;font-weight:600;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.cyc-hint{color:var(--ink-3);font-size:13px;margin:0}
.cy-node,.cy-sup,.cy-band{cursor:pointer;transition:opacity .15s}
.cy-node rect.box,.cy-band rect.box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.cy-node:hover rect.box,.cy-band:hover rect.box,.cy-node:focus-visible rect.box{fill:var(--surface-2)}
.cy-node.dish rect.box{fill:var(--surface-2)}
.cy-sup rect.box{fill:var(--bg);stroke:var(--ink-3);stroke-width:1.1;stroke-dasharray:5 4}
.cy-sup:hover rect.box,.cy-sup:focus-visible rect.box{stroke:var(--accent)}
.cy-node.hl rect.box,.cy-sup.hl rect.box,.cy-band.hl rect.box{stroke:var(--c);stroke-width:2.6;stroke-dasharray:none}
.cy-dimmed{opacity:.28}
.cy-n{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;fill:var(--accent)}
.cy-t{font-family:var(--display);font-weight:600;font-size:18px;fill:var(--ink)}
.cy-k{font-family:var(--body);font-size:11.5px;fill:var(--ink-2)}
.cy-m{font-family:var(--mono);font-size:10.5px;fill:var(--ink-3)}
.cy-rv{font-family:var(--mono);font-size:10.5px;fill:var(--st-proposed)}
.cy-track{fill:var(--surface-2)}
.cy-node.dish .cy-track{fill:var(--line)}
.cy-fill{fill:var(--accent)}
.cy-arrow{fill:none;stroke:var(--ink-2);stroke-width:1.7}
.cy-arrow.fb{stroke:var(--st-proposed);stroke-dasharray:6 4}
.cy-tap{fill:none;stroke:var(--ink-3);stroke-width:1.1;stroke-dasharray:3 4}
.cy-ah{fill:var(--ink-2)}
.cy-ah.fb{fill:var(--st-proposed)}
.cy-lbl{font-family:var(--mono);font-size:11.5px;fill:var(--ink-2);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.cy-lbl.fb{fill:var(--st-proposed)}
.cy-conn{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4;opacity:0;transition:opacity .15s;pointer-events:none}
.cy-conn.on{opacity:1}
.cy-elec{fill:var(--ink-3)}
.cy-elec.in{fill:var(--accent)}
.cy-elec.out{fill:var(--st-proposed)}

@media (max-width:1100px){
  .strip{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .stage,.stage:first-child,.stage:last-child{border-radius:6px;margin-left:0}
  .stage::after{display:none}
  .others{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:900px){
  main .wrap{grid-template-columns:minmax(0,1fr)}
  aside.insp{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:78vh;border-radius:12px 12px 0 0;z-index:25;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 30px color-mix(in srgb,var(--ink) 20%,transparent)}
  aside.insp.closed{display:none}
  .insp .x{display:inline-block}
  header.top .wrap{grid-template-columns:1fr}
  .mea{display:none}
  .gates{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){

function lab(list,v){for(var i=0;i<list.length;i++){if(list[i][0]===v)return list[i][1];}return v||"";}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

  if(!gh.repo){ var m=location.hostname.match(/^([^.]+)\.github\.io$/i), seg=location.pathname.split("/")[1]; if(m){ gh.repo = m[1]+"/"+(seg||(m[1]+".github.io")); } }
})();
function ghStore(){ try{ localStorage.setItem(GHK, JSON.stringify({repo:gh.repo,branch:gh.branch,token:gh.token})); }catch(e){} }
function ghDecode(res){
  var bin = atob(String(res.content||"").replace(/\s/g,"")); var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return JSON.parse(new TextDecoder("utf-8").decode(bytes));
}
function ghEncode(str){
  var bytes = new TextEncoder().encode(str), bin="";
  for(var i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function ghApi(method, body){
  var url = "https://api.github.com/repos/"+gh.repo+"/contents/"+gh.path+(method==="GET"? "?ref="+encodeURIComponent(gh.branch)+"&t="+Date.now() : "");
  var headers = {"Accept":"application/vnd.github+json"}; if(gh.token) headers.Authorization = "Bearer "+gh.token;
  if(body) headers["Content-Type"]="application/json";
  return fetch(url,{method:method,headers:headers,body:body?JSON.stringify(body):undefined}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(j){ if(!r.ok){ var e=new Error(j.message||("HTTP "+r.status)); e.status=r.status; throw e; } return j; });
  });
}
function setNodes(list){
  nodes.length=0; list.forEach(function(x){nodes.push(x);});
  ORIGINAL = JSON.parse(JSON.stringify(nodes)); index();
  if(ui.sel && !byId[ui.sel]) ui.sel=null;
}
function ghRefresh(quiet){
  if(!ghMode || dirty || saving) return Promise.resolve();
  var viaApi = gh.repo ? ghApi("GET").then(function(res){ return {sha:res.sha, doc:ghDecode(res)}; }) : Promise.reject(new Error("no repo"));
  return viaApi.catch(function(){
    return fetch("data.json?t="+Date.now()).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }).then(function(doc){ return {sha:null, doc:doc}; });
  }).then(function(r){
    gh.sha = r.sha;
    if(dirty || !r.doc || !Array.isArray(r.doc.nodes)) return;
    var ns = r.doc.streams || STREAMS_ORIG;
    var chN = JSON.stringify(r.doc.nodes)!==JSON.stringify(ORIGINAL), chS = JSON.stringify(ns)!==JSON.stringify(STREAMS_ORIG);
    if(chN || chS){ STREAMS=JSON.parse(JSON.stringify(ns)); STREAMS_ORIG=JSON.parse(JSON.stringify(ns)); if(ui.stream&&!curStream()) ui.stream=null; setNodes(r.doc.nodes); renderAll(); if(!quiet) toast("Loaded the latest version."); }
  }).catch(function(){ if(!quiet) toast("Could not reach the latest data. Showing the copy bundled with this page."); });
}
function ghDoc(list, streams){ return JSON.stringify({schema:2, saved:todayISO(), nodes:list, streams:streams}, null, 1)+"\n"; }
function ghSave(){
  if(saving) return;
  if(!gh.token || !gh.repo){ ui.sync=true; renderSync(); toast("Connect GitHub first."); return; }
  saving=true; renderSavebar();
  var mine = diff(ORIGINAL, nodes), attempt=0;
  var myStreams = JSON.stringify(STREAMS)!==JSON.stringify(STREAMS_ORIG) ? JSON.parse(JSON.stringify(STREAMS)) : null;
  function once(){
    return ghApi("GET").then(function(remote){
      var rdoc = ghDecode(remote), merged = applyPatch(rdoc.nodes, mine), st = myStreams || rdoc.streams || STREAMS;
      return ghApi("PUT",{message:"Update design tracker", content:ghEncode(ghDoc(merged, st)), sha:remote.sha, branch:gh.branch}).then(function(res){ return {merged:merged, streams:st, sha:res.content&&res.content.sha}; });
    }).catch(function(err){
      if((err.status===409||err.status===422) && attempt++<2) return once();
      throw err;
    });
  }
  once().then(function(r){
    saving=false; dirty=false; gh.sha=r.sha; STREAMS=r.streams; STREAMS_ORIG=JSON.parse(JSON.stringify(r.streams)); if(ui.stream&&!curStream()) ui.stream=null; setNodes(r.merged); renderAll();
    toast("Saved to GitHub. Teammates see it on their next load.");
  }).catch(function(err){
    saving=false; renderSavebar();
    if(err.status===401||err.status===403||err.status===404){ ui.sync=true; renderSync(); toast("GitHub refused the save. Check the token and that it can write to "+gh.repo+"."); }
    else toast("Save failed ("+(err.message||"network")+"). Try again.");
  });
}
function ghExport(){
  var b=new Blob([ghDoc(nodes, STREAMS)],{type:"application/json"}), a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download="data.json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}

/* ---------- deadlines ---------- */
var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function pad2(x){ return (x<10?"0":"")+x; }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function parseISO(s){ var m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(s||""); return m? Date.UTC(+m[1],+m[2]-1,+m[3]) : null; }
function fmtDate(s){ var m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(s||""); return m? MON[+m[2]-1]+" "+(+m[3]) : ""; }
function daysUntil(s){ var a=parseISO(s), b=parseISO(todayISO()); return a==null? null : Math.round((a-b)/864e5); }
function dueState(n){
  if(!n.deadline || parseISO(n.deadline)==null) return "";
  var fin = n.kind==="area" ? (prog(n.id).total>0 && prog(n.id).pct===100) : isDone(n);
  if(fin) return "done";
  var d = daysUntil(n.deadline);
  return d<0 ? "over" : d<=7 ? "soon" : "later";
}
function dueLabel(n){
  var s = dueState(n), d = daysUntil(n.deadline);
  if(s==="over") return "Overdue "+fmtDate(n.deadline);
  if(s==="soon") return d===0? "Due today" : d===1? "Due tomorrow" : "Due "+fmtDate(n.deadline);
  return fmtDate(n.deadline);
}
function dueCounts(){
  var c={over:0,week:0,has:0};
  nodes.forEach(function(n){ var s=dueState(n); if(n.deadline) c.has++; if(s==="over") c.over++; if(s==="over"||s==="soon") c.week++; });
  return c;
}
function updateDueSelect(){
  var el=document.getElementById("f-due"); if(!el) return; var c=dueCounts();
  el.innerHTML = [["","Deadline: any"],["over","Overdue ("+c.over+")"],["week","Overdue or due in 7 days ("+c.week+")"],["has","Has a deadline ("+c.has+")"],["none","No deadline"]]
    .map(function(o){return '<option value="'+o[0]+'"'+(o[0]===ui.due?" selected":"")+'>'+o[1]+'</option>';}).join("");
}

/* ---------- progress ---------- */
function isItem(n){ return n.kind !== "area"; }
function isDone(n){
  if(n.kind==="decision"||n.kind==="question") return n.status==="decided"||n.status==="build"||n.status==="verified";
  return n.status==="verified";
}
function subtree(id, out){ out = out||[]; (kids[id]||[]).forEach(function(c){ out.push(byId[c]); subtree(c,out); }); return out; }
function prog(id){
  var items = subtree(id).filter(isItem); var self = byId[id];
  if(self && isItem(self)) items.push(self);
  var d = items.filter(isDone).length;
  return {done:d, total:items.length, pct: items.length? Math.round(100*d/items.length):0,
    review: items.filter(function(n){return n.status==="proposed";}).length,
    open: items.filter(function(n){return (n.kind==="decision"||n.kind==="question") && !isDone(n);}).length};
}
function gateProg(maxOrder){
  var items = nodes.filter(function(n){ return isItem(n) && GATE_ORDER[n.gate] && GATE_ORDER[n.gate]<=maxOrder; });
  var d = items.filter(isDone).length;
  return {done:d,total:items.length,pct:items.length?Math.round(100*d/items.length):0};
}

/* ---------- filtering ---------- */
function owners(){
  var set = {};
  nodes.forEach(function(n){ String(n.owner||"").split(",").forEach(function(o){ o=o.trim(); if(o) set[o]=1; }); });
  return Object.keys(set).sort();
}
function filtersOn(){ return ui.q||ui.kind||ui.status||ui.gate||ui.owner||ui.due||ui.review; }
function matches(n){
  if(ui.review && n.status!=="proposed") return false;
  if(ui.kind && n.kind!==ui.kind) return false;
  if(ui.status && n.status!==ui.status) return false;
  if(ui.gate && n.gate!==ui.gate) return false;
  if(ui.due){ var ds = dueState(n);
    if(ui.due==="over" && ds!=="over") return false;
    if(ui.due==="week" && ds!=="over" && ds!=="soon") return false;
    if(ui.due==="has" && !n.deadline) return false;
    if(ui.due==="none" && (n.deadline || n.kind==="area")) return false; }
  if(ui.owner && String(n.owner||"").split(",").map(function(s){return s.trim();}).indexOf(ui.owner)<0) return false;
  if(ui.q){ var q = ui.q.toLowerCase(); var hay = (n.title+" "+n.notes+" "+n.owner+" "+n.src+" "+(n.done||"")+" "+(n.options||[]).join(" ")+" "+(n.needs||[]).map(function(x){return x.t;}).join(" ")+" "+(n.bugs||[]).join(" ")+" "+(n.files||[]).join(" ")).toLowerCase(); if(hay.indexOf(q)<0) return false; }
  return true;
}
var visible = null;
function computeVisible(){
  if(!filtersOn()){ visible = null; return; }
  visible = {};
  nodes.forEach(function(n){ if(matches(n)){ visible[n.id]="hit"; var p=n.parent; while(p){ if(!visible[p]) visible[p]="path"; p=byId[p]?byId[p].parent:null; } } });
}

    dots("log", BAND.x+BAND.hw-14, BAND.y)+'</g>');
  SUPPORT.forEach(function(s){ g.push(supNode(s)); });
  box.innerHTML='<svg viewBox="0 38 1100 600" role="img" aria-label="Full closed-loop cycle with the assignments that work on each step">'+g.join("")+'</svg>';
  var det=document.getElementById("cyc-detail"), s=STREAMS.filter(function(x){return x.id===ui.stream;})[0];
  if(ui.editStreams && !ro()){ if(s && det.contains(document.activeElement)) return; det.innerHTML = streamEditor(s); return; }
  if(!s){ det.innerHTML='<p class="cyc-hint" style="margin-top:12px">Select an assignment above to see what it does at each step.</p>'; return; }
  var ci=STREAMS.indexOf(s);
  det.innerHTML='<div class="cyc-detail"><h3><span class="stream" style="--c:'+streamColor(ci)+';padding:0;border:0;background:none"><span class="dot"></span></span>'+esc(s.name)+' <small>'+esc(s.people)+'</small></h3><ul>'+
    s.links.map(function(l){ return '<li><button data-jump="'+l[0]+'">'+esc(SHORT[l[0]]||l[0])+'</button>: '+esc(l[1])+'</li>'; }).join("")+'</ul></div>';
}
function streamEditor(s){
  if(!s) return '<div class="cyc-detail sted"><p class="cyc-hint">Select an assignment above to edit it, or add a new one.</p></div>';
  var h = '<div class="cyc-detail sted"><div class="grid2"><div class="field"><label for="st-name">Assignment name</label><input id="st-name" data-st="name" value="'+esc(s.name)+'"></div>'+
    '<div class="field"><label for="st-people">People (comma separated)</label><input id="st-people" data-st="people" value="'+esc(s.people)+'"></div></div>'+
    '<div class="lab">Steps this assignment works on, and what it does at each</div>';
  s.links.forEach(function(l,i){
    h += '<div class="lk"><select data-st="lk-id" data-i="'+i+'" aria-label="Step">'+STEP_IDS.map(function(id){return '<option value="'+id+'"'+(id===l[0]?" selected":"")+'>'+esc(SHORT[id]||id)+'</option>';}).join("")+'</select>'+
      '<input data-st="lk-txt" data-i="'+i+'" value="'+esc(l[1])+'" placeholder="What they do at this step" aria-label="What they do"><button class="btn x" data-act="st-dellink" data-i="'+i+'">Remove</button></div>';
  });
  h += '<div class="row-btns"><button class="btn" data-act="st-addlink">Add a step</button><button class="btn danger" data-act="st-del">Delete assignment</button></div></div>';
  return h;
}
function showConn(id,on){ document.querySelectorAll('.cy-conn[data-from="'+id+'"]').forEach(function(p){ p.classList.toggle("on",on); }); }

function renderAll(){ renderGates(); renderStrip(); renderTree(); renderInsp(); renderSavebar(); renderCycle(); renderSync(); }

/* ---------- editing ---------- */
var treeTimer=null;
function touched(full){
  dirty = true;
  index();
  if(full){ renderAll(); return; }
  clearTimeout(treeTimer); treeTimer = setTimeout(function(){ renderGates(); renderStrip(); renderTree(); renderSavebar(); renderCycle(); }, 160);
}
function newId(){ return "n"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function blank(parent){ return {id:newId(),parent:parent,title:"New item",kind:"build",status:"todo",owner:"",gate:"",notes:"",src:"",deps:[],options:[],chosen:null,done:"",needs:[],bugs:[],files:[],deadline:""}; }
function siblings(n){ return nodes.filter(function(m){return m.parent===n.parent;}); }
function moveNode(n,dir){
  var sib = siblings(n); var i = sib.indexOf(n); var j = i+dir; if(j<0||j>=sib.length) return;
  var other = sib[j]; var a = nodes.indexOf(n), b = nodes.indexOf(other);
  nodes[a]=other; nodes[b]=n;
}
function insertAfterSubtree(target, node){
  var desc = subtree(target.id); var last = desc.length? desc[desc.length-1] : target;
  nodes.splice(nodes.indexOf(last)+1, 0, node);
}
var armed=null;
function act(a, btn){
  var n = ui.sel && byId[ui.sel];
  if(a==="close"){ ui.sel=null; renderTree(); renderInsp(); return; }
  if(a==="save"){ if(ghMode) ghSave(); else save(); return; }
  if(a.indexOf("st-")===0){
    if(ro()) return; if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if(a==="st-edit"){ ui.editStreams=!ui.editStreams; renderCycle(); return; }
    if(a==="st-add"){ var ns={id:"s-"+newId(),name:"New assignment",people:"",links:[]}; STREAMS.push(ns); ui.stream=ns.id; ui.editStreams=true; streamsTouched(true); var nm=document.getElementById("st-name"); if(nm){ nm.focus(); nm.select(); } return; }
    var cs=curStream(); if(!cs) return;
    if(a==="st-addlink"){ var used=cs.links.map(function(l){return l[0];}); var pick=STEP_IDS.filter(function(x){return used.indexOf(x)<0;})[0]||STEP_IDS[0]; cs.links.push([pick,""]); streamsTouched(true); return; }
    if(a==="st-dellink"){ cs.links.splice(+btn.getAttribute("data-i"),1); streamsTouched(true); return; }
    if(a==="st-del"){
      if(armedSt!==cs.id){ armedSt=cs.id; btn.classList.add("armed"); btn.textContent="Confirm: delete this assignment"; return; }
      STREAMS.splice(STREAMS.indexOf(cs),1); ui.stream=null; armedSt=null; streamsTouched(true); return;
    }
    return;
  }
  if(a==="sync"){ ui.sync=true; renderSync(); var sp=document.getElementById("syncpanel"); if(sp&&sp.scrollIntoView) sp.scrollIntoView({block:"center"}); return; }
  if(a==="export"){ ghExport(); return; }
  if(a==="gh-connect"){
    gh.repo=document.getElementById("gh-repo").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\/$/,"");
    gh.branch=document.getElementById("gh-branch").value.trim()||"main"; gh.token=document.getElementById("gh-token").value.trim();
    ghStore(); ui.sync=false; renderSync(); renderSavebar(); toast(gh.token?"Connection saved in this browser.":"Repository saved. Add a token to save edits."); ghRefresh(true); return;
  }
  if(a==="gh-disconnect"){ gh.token=""; ghStore(); ui.sync=false; renderSync(); renderSavebar(); toast("Token removed from this browser."); return; }
  if(a==="discard"){ STREAMS=JSON.parse(JSON.stringify(STREAMS_ORIG)); if(ui.stream&&!curStream()) ui.stream=null; nodes.length=0; JSON.parse(JSON.stringify(ORIGINAL)).forEach(function(x){nodes.push(x);}); dirty=false; index(); if(ui.sel&&!byId[ui.sel]) ui.sel=null; renderAll(); return; }
  if(!n || ro()) return;
  if(a==="addlist"){ var k=btn.getAttribute("data-key"); n[k]=(n[k]||[]).concat([k==="needs"?{t:"",ok:false}:""]); touched(true); var tas=document.querySelectorAll('textarea[data-list="'+k+'"]'); if(tas.length) tas[tas.length-1].focus(); return; }
  if(a==="dellist"){ var k2=btn.getAttribute("data-key"); n[k2].splice(+btn.getAttribute("data-i"),1); touched(true); return; }
  if(a==="addopt"){ n.options=(n.options||[]).concat(["New option"]); touched(true); var last=document.getElementById("e-opt-"+(n.options.length-1)); if(last){last.focus();last.select();} return; }
  if(a==="delopt"){ var i=+btn.getAttribute("data-i"); n.options.splice(i,1); if(n.chosen===i) n.chosen=null; else if(n.chosen>i) n.chosen--; touched(true); return; }
  if(a==="clearchosen"){ n.chosen=null; touched(true); return; }
  if(a==="deldep"){ n.deps = n.deps.filter(function(d){return d!==btn.getAttribute("data-d");}); touched(true); return; }
  if(a==="addchild"){ var c=blank(n.id); insertAfterSubtree(n,c); ui.open[n.id]=true; saveUI(); ui.sel=c.id; touched(true); focusTitle(); return; }
  if(a==="addsib"){ var s=blank(n.parent); insertAfterSubtree(n,s); ui.sel=s.id; touched(true); focusTitle(); return; }
  if(a==="up"||a==="down"){ moveNode(n, a==="up"?-1:1); touched(true); return; }
  if(a==="del"){
    if(armed!==n.id){ armed=n.id; var cnt=subtree(n.id).length; btn.classList.add("armed"); btn.textContent = cnt? "Confirm: delete with "+cnt+" sub-items" : "Confirm delete"; return; }
    var gone = [n.id].concat(subtree(n.id).map(function(m){return m.id;}));
    for(var k=nodes.length-1;k>=0;k--){ if(gone.indexOf(nodes[k].id)>=0) nodes.splice(k,1); }
    nodes.forEach(function(m){ m.deps=(m.deps||[]).filter(function(d){return gone.indexOf(d)<0;}); });
    ui.sel = n.parent; armed=null; touched(true); return;
  }
}
function focusTitle(){ var t=document.getElementById("e-title"); if(t){ t.focus(); t.select(); } }

/* ---------- save / restore ---------- */
function diff(base, cur){
  var b={}, c={}, patch={changed:{}, prev:{}, deleted:[]};
  base.forEach(function(n){b[n.id]=n;});
  cur.forEach(function(n,i){ c[n.id]=n; if(!b[n.id] || JSON.stringify(b[n.id])!==JSON.stringify(n)){ patch.changed[n.id]=n; patch.prev[n.id]= i>0? cur[i-1].id : null; } });
  base.forEach(function(n){ if(!c[n.id]) patch.deleted.push(n.id); });
  return patch;
}
function applyPatch(list, patch){
  var out = list.map(function(n){return JSON.parse(JSON.stringify(n));});
  var idx = function(id){ for(var i=0;i<out.length;i++) if(out[i].id===id) return i; return -1; };
  patch.deleted.forEach(function(id){ var i=idx(id); if(i>=0) out.splice(i,1); });
  Object.keys(patch.changed).forEach(function(id){
    var n = JSON.parse(JSON.stringify(patch.changed[id])); var i = idx(id);
    if(i>=0){ out[i]=n; return; }
    var p = patch.prev[id]; var j = p? idx(p) : -1; out.splice(j+1,0,n);
  });
  return out;
}
function buildDocument(list){
  var data = JSON.stringify({schema:2, saved:new Date().toISOString().slice(0,10), nodes:list, streams:STREAMS}).replace(/</g,"\\u003c");
  var style = document.getElementById("app-style").textContent;
  var script = document.getElementById("app-script").textContent;
  var SC = "<"+"/script>", ST = "<"+"/style>";
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+ST+'</head><body>\n'+
    '<title>'+PAGE_TITLE+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+FONT_LINK+'\n'+
    '<style id="app-style">'+style+ST+'\n<div id="app"></div>\n'+
    '<script type="application/json" id="tracker-data">'+data+SC+'\n'+
    '<script id="app-script">'+script+SC+'\n</body></html>';
}
function toast(t){ var d=document.createElement("div"); d.className="toast"; d.setAttribute("role","status"); d.textContent=t; document.body.appendChild(d); setTimeout(function(){d.remove();},2600); }
function save(){
  if(!artifactNS || saving) return;
  saving = true; renderSavebar();
  try{ sessionStorage.setItem(PENDING_KEY, JSON.stringify(diff(ORIGINAL, nodes))); }catch(e){}
  artifactNS.publish(buildDocument(nodes)).then(function(){
    /* the view reloads to the new version */
  }).catch(function(err){
    saving=false;
    var code = err && err.code;
    if(code==="conflict"){ toast("Someone saved first. Reloading their version; your edits can be restored."); return; }
    if(code==="not_writer"||code==="not_granted"||code==="consent_required"||code==="capability_disabled"||code==="not_declared"){ canWrite=false; renderAll(); toast("This view is read-only."); return; }
    if(code==="rate_limited"){ toast("Saving too often. Wait a moment, then save again."); renderSavebar(); return; }
    toast("Save failed. Try again in a moment."); renderSavebar();
  });
}
function checkPending(){
  var raw=null; try{ raw = sessionStorage.getItem(PENDING_KEY); }catch(e){}
  if(!raw) return;
  var patch; try{ patch=JSON.parse(raw); }catch(e){ return; }
  var merged = applyPatch(nodes, patch);
  if(JSON.stringify(merged)===JSON.stringify(nodes)){ try{ sessionStorage.removeItem(PENDING_KEY); }catch(e){} toast("Saved for the team."); return; }
  var b = document.getElementById("banner");
  var count = Object.keys(patch.changed).length + patch.deleted.length;
  b.innerHTML = '<div class="banner"><div class="wrap"><p>Someone else saved before your last save went through. Your '+count+' edited item'+(count===1?"":"s")+' can be re-applied on top of their version.</p>'+
    '<button class="btn" id="pend-drop">Drop my edits</button><button class="btn primary" id="pend-apply">Re-apply my edits</button></div></div>';
  document.getElementById("pend-drop").onclick=function(){ try{sessionStorage.removeItem(PENDING_KEY);}catch(e){} b.innerHTML=""; };
  document.getElementById("pend-apply").onclick=function(){
    var m = applyPatch(nodes, patch); nodes.length=0; m.forEach(function(x){nodes.push(x);});
    try{sessionStorage.removeItem(PENDING_KEY);}catch(e){} b.innerHTML=""; touched(true); toast("Edits re-applied. Save to publish them.");
  };
}

/* ---------- copy outline ---------- */
function outline(){
  computeVisible();
  var lines=[];
  function walk(id,d){ var n=byId[id]; if(visible && !visible[id]) return;
    var bits=[]; if(n.kind!=="area") bits.push(lab(STATUSES,n.status)); if(n.owner) bits.push(n.owner); if(n.gate) bits.push("needed by "+lab(GATES,n.gate)); if(n.deadline && fmtDate(n.deadline)) bits.push("due "+fmtDate(n.deadline)+" "+n.deadline.slice(0,4));
    var ch = (n.kind==="decision"&&n.chosen!=null&&n.options[n.chosen])? " -> chosen: "+n.options[n.chosen] : "";
    lines.push(new Array(d+1).join("  ")+"- "+(n.kind!=="area"?"["+lab(KINDS,n.kind)+"] ":"")+n.title+(bits.length?" ("+bits.join(", ")+")":"")+ch);
    var pad=new Array(d+2).join("  ");
    if(n.done) lines.push(pad+"  Done when: "+n.done);
    (n.needs||[]).forEach(function(x){ lines.push(pad+"  ["+(x.ok?"x":" ")+"] "+x.t); });
    (kids[id]||[]).forEach(function(c){walk(c,d+1);}); }
  nodes.filter(function(n){return !n.parent;}).forEach(function(r){walk(r.id,0);});
  return lines.join("\n");
}
function copyText(t){
  function fallback(){ var ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); var ok=false; try{ok=document.execCommand("copy");}catch(e){} ta.remove(); toast(ok?"Outline copied":"Copy was blocked. Select the text manually."); }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){toast("Outline copied");}, fallback); } else fallback();
}

/* ---------- events ---------- */
function bindToolbar(){
  var q=document.getElementById("f-q"), k=document.getElementById("f-kind"), s=document.getElementById("f-status"), g=document.getElementById("f-gate"), o=document.getElementById("f-owner"), r=document.getElementById("f-review");

  q.addEventListener("input",function(){ui.q=q.value.trim(); renderTree();});
  k.addEventListener("change",function(){ui.kind=k.value; renderTree();});
  s.addEventListener("change",function(){ui.status=s.value; renderTree();});
  g.addEventListener("change",function(){ui.gate=g.value; renderTree();});
  o.addEventListener("change",function(){ui.owner=o.value; renderTree();});
  document.getElementById("f-due").addEventListener("change",function(e){ui.due=e.target.value; renderTree();});

  r.addEventListener("click",function(){ui.review=!ui.review; r.setAttribute("aria-pressed",String(ui.review)); renderTree();});
  document.getElementById("b-expand").addEventListener("click",function(){ nodes.forEach(function(n){ if((kids[n.id]||[]).length) ui.open[n.id]=true; }); saveUI(); renderTree(); });
  document.getElementById("b-collapse").addEventListener("click",function(){ ui.open={root:true}; saveUI(); renderTree(); });
  document.getElementById("b-copy").addEventListener("click",function(){ copyText(outline()); });
}
function select(id){ ui.sel=id; armed=null; renderTree(); renderInsp(); }
function reveal(id){ var p=byId[id]?byId[id].parent:null; while(p){ ui.open[p]=true; p=byId[p]?byId[p].parent:null; } saveUI(); }

app.addEventListener("click",function(e){
  var gf=e.target.closest("[data-gatefilter]");
  if(gf){ var gv=gf.getAttribute("data-gatefilter"); var on=gf.getAttribute("aria-pressed")==="true";
    document.querySelectorAll("[data-gatefilter]").forEach(function(b){b.setAttribute("aria-pressed","false");});
    ui.review=false; ui.gate=""; var rb=document.getElementById("f-review"); rb.setAttribute("aria-pressed","false"); document.getElementById("f-gate").value="";
    if(!on){ gf.setAttribute("aria-pressed","true"); if(gv==="review"){ ui.review=true; rb.setAttribute("aria-pressed","true"); } else { ui.gate=gv; document.getElementById("f-gate").value=gv; } }
    renderTree(); var tb=document.getElementById("tree"); if(tb && !on) tb.scrollIntoView({block:"start",behavior:"smooth"}); return; }
  var sb=e.target.closest("[data-stream]");
  if(sb){ var sid=sb.getAttribute("data-stream"); ui.stream = ui.stream===sid? null : sid; renderCycle(); return; }
  var t=e.target.closest("[data-tog],[data-jump],[data-go],[data-act],.row"); if(!t) return;
  if(t.hasAttribute("data-tog")){ e.stopPropagation(); var id=t.getAttribute("data-tog"); ui.open[id]=!ui.open[id]; saveUI(); renderTree(); return; }
  if(t.hasAttribute("data-jump")){ var j=t.getAttribute("data-jump"); reveal(j); ui.open[j]=true; saveUI(); select(j); var row=document.querySelector('.row[data-id="'+j+'"]'); if(row) row.scrollIntoView({block:"start",behavior:"smooth"}); return; }
  if(t.hasAttribute("data-go")){ var gid=t.getAttribute("data-go"); reveal(gid); select(gid); var r2=document.querySelector('.row[data-id="'+gid+'"]'); if(r2) r2.scrollIntoView({block:"center",behavior:"smooth"}); return; }
  if(t.hasAttribute("data-act")){ act(t.getAttribute("data-act"), t); return; }
  if(t.classList.contains("row")){ select(t.getAttribute("data-id")); }
});
app.addEventListener("input",function(e){
  var t=e.target;
  if(t.hasAttribute && t.hasAttribute("data-st") && t.tagName!=="SELECT"){ if(ro()) return; var cs=curStream(); if(!cs) return; var k=t.getAttribute("data-st");
    if(k==="name") cs.name=t.value; else if(k==="people") cs.people=t.value; else if(k==="lk-txt") cs.links[+t.getAttribute("data-i")][1]=t.value;
    streamsTouched(false); return; }
  var n = ui.sel && byId[ui.sel]; if(!n||ro()) return;
  if(t.id==="e-title"){ n.title=t.value; touched(false); }
  else if(t.id==="e-owner"){ n.owner=t.value; touched(false); }
  else if(t.id==="e-notes"){ n.notes=t.value; autosize(t); touched(false); }
  else if(t.id==="e-src"){ n.src=t.value; touched(false); }
  else if(t.id==="e-done"){ n.done=t.value; autosize(t); touched(false); }
  else if(t.hasAttribute("data-list")){ var k=t.getAttribute("data-list"), i=+t.getAttribute("data-i"); if(k==="needs") n.needs[i].t=t.value; else n[k][i]=t.value; autosize(t); touched(false); }
  else if(t.hasAttribute("data-opt")){ n.options[+t.getAttribute("data-opt")]=t.value; touched(false); }
});
app.addEventListener("change",function(e){
  var t=e.target;
  if(t.hasAttribute && t.getAttribute("data-st")==="lk-id"){ if(ro()) return; var cs=curStream(); if(!cs) return; cs.links[+t.getAttribute("data-i")][0]=t.value; if(document.activeElement&&document.activeElement.blur) document.activeElement.blur(); streamsTouched(true); return; }
  var n = ui.sel && byId[ui.sel]; if(!n||ro()) return;
  if(t.id==="e-kind"){ n.kind=t.value; touched(true); }
  else if(t.id==="e-status"){ n.status=t.value; touched(true); }
  else if(t.id==="e-gate"){ n.gate=t.value; touched(true); }
  else if(t.id==="e-deadline"){ n.deadline=t.value; touched(true); }
  else if(t.hasAttribute("data-need-ok")){ n.needs[+t.getAttribute("data-need-ok")].ok=t.checked; touched(true); }
  else if(t.hasAttribute("data-chosen")){ n.chosen=+t.getAttribute("data-chosen"); if(n.kind==="decision" && (n.status==="todo"||n.status==="research"||n.status==="proposed")) n.status="decided"; touched(true); }
  else if(t.id==="e-adddep" && t.value){ n.deps=(n.deps||[]).concat([t.value]); touched(true); }
});
app.addEventListener("mouseover",function(e){ var s=e.target.closest&&e.target.closest("[data-sup]"); if(s) showConn(s.getAttribute("data-sup"),true); });
app.addEventListener("mouseout",function(e){ var s=e.target.closest&&e.target.closest("[data-sup]"); if(s && !(e.relatedTarget && s.contains(e.relatedTarget))) showConn(s.getAttribute("data-sup"),false); });
app.addEventListener("focusin",function(e){ var s=e.target.closest&&e.target.closest("[data-sup]"); if(s) showConn(s.getAttribute("data-sup"),true); });
app.addEventListener("focusout",function(e){ var s=e.target.closest&&e.target.closest("[data-sup]"); if(s) showConn(s.getAttribute("data-sup"),false); });
app.addEventListener("keydown",function(e){
  var jg=e.target.closest&&e.target.closest("g[data-jump]");
  if(jg && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); jg.dispatchEvent(new MouseEvent("click",{bubbles:true})); return; }

  if(row && (e.key==="Enter"||e.key===" ") && e.target===row){ e.preventDefault(); select(row.getAttribute("data-id")); }
});

/* ---------- boot ---------- */
shell(); renderMEA(); renderAll();
document.querySelectorAll(".row").forEach(function(r){r.tabIndex=0;});
var mo = new MutationObserver(function(){ document.querySelectorAll(".row:not([tabindex])").forEach(function(r){r.tabIndex=0;}); });
mo.observe(document.getElementById("tree"),{childList:true,subtree:true});
checkPending();
if(ghMode){
  ghRefresh(true);
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) ghRefresh(true); });
}

if(window.claude && typeof window.claude.use==="function"){
  window.claude.use("artifact").then(function(ns){ artifactNS = ns || null; renderSavebar(); }).catch(function(){ artifactNS=null; });
  window.claude.use("user").then(function(u){
    if(!u) return; return u.canEdit().then(function(ok){ canWrite = !!ok; renderInsp(); renderSavebar(); });
  }).catch(function(){});
}
